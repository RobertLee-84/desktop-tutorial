<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retro Game</title>
  <link rel="stylesheet" href="https://v8.js-dos.com/latest/js-dos.css">
  <link rel="stylesheet" href="./css/style.css">
  <script src="https://v8.js-dos.com/latest/js-dos.js"></script>
</head>
<body>
  <header class="header">
    <h1>🕹️ Retro Game</h1>
    <span id="status">게임을 선택하세요</span>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <h2>게임 목록</h2>
      <button class="game-button active" data-game="" disabled>
        테스트 게임
      </button>
      <p class="hint">
        아직 게임 파일이 없습니다.<br>
        다음 단계에서 합법적으로 배포 가능한 DOS 게임을 연결합니다.
      </p>
    </aside>

    <section class="game-area">
      <div id="dosbox"></div>
      <div id="placeholder">
        <div class="placeholder-icon">🎮</div>
        <h2>Retro Game</h2>
        <p>게임 파일을 연결하면 이곳에서 실행됩니다.</p>
      </div>
    </section>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
